<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Humanize AI Slop: take the robot accent out of your writing">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b1e"/>
      <stop offset="55%" stop-color="#1c1640"/>
      <stop offset="100%" stop-color="#26204f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="none" stroke="#3a3170" stroke-width="2"/>

  <rect x="0" y="0" width="10" height="320" fill="url(#accent)"/>

  <text x="56" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#fbf7ff">Humanize AI Slop</text>
  <text x="56" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c9bfff">Take the robot accent out of your writing. Draft with AI, publish as yourself.</text>

  <g font-family="Consolas, Menlo, monospace" font-size="18">
    <text x="56" y="182" fill="#ff8fa3" text-decoration="line-through">Let's be honest: this tool isn't just a game changer, it's a paradigm shift,</text>
    <text x="56" y="210" fill="#ff8fa3" text-decoration="line-through">standing as a testament to every creator's ever-evolving journey.</text>
    <text x="56" y="252" fill="#ffd166">This tool removes AI writing patterns from your text before you publish.</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c9bfff">
    <text x="56" y="296">39 patterns</text>
    <text x="196" y="296">humanizer + no ai slop, in English</text>
    <text x="1060" y="296" text-anchor="end" fill="#8f83c9">MIT · Esl1h/humanize-ai-slop</text>
  </g>
</svg>
