name: Uncovered AI pattern
description: Report an AI writing pattern the skill does not catch yet.
title: "[pattern] "
labels: ["new pattern"]
body:
  - type: textarea
    id: excerpt
    attributes:
      label: Example excerpt
      description: Paste a real excerpt (names can be anonymized) that shows the problem.
      placeholder: "Here's what nobody tells you: this project is a game changer..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is the pattern?
      description: Describe what sounds artificial in this excerpt and, if you can, how you would rewrite it.
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related pattern (optional)
      description: If this resembles one of the 39 patterns in SKILL.md, give its number.
    validations:
      required: false
